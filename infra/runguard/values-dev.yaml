global:
  environment: dev
  imageTag: latest

api-gateway:
  fullnameOverride: api-gateway
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    repository: runguard-api-gateway
    tag: latest
    pullPolicy: Never
  env:
    - name: API_GATEWAY_PORT
      value: "8080"
    - name: BACKEND_URL
      value: "http://backend:8081"
    - name: OTEL_SDK_DISABLED
      value: "true"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

backend:
  fullnameOverride: backend
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    repository: runguard-backend
    tag: latest
    pullPolicy: Never
  env:
    - name: BACKEND_PORT
      value: "8081"
    - name: DB_HOST
      value: "postgres"
    - name: DB_PORT
      value: "5432"
    - name: DB_USER
      value: "runguard"
    - name: DB_NAME
      value: "runguard"
    - name: DB_PASSWORD
      value: "runguard"
    - name: REDIS_ADDR
      value: "redis:6379"
    - name: NATS_URL
      value: "nats://nats:4222"
    - name: OTEL_SDK_DISABLED
      value: "true"

operator:
  fullnameOverride: operator
  replicaCount: 1
  image:
    repository: runguard-operator
    tag: latest
    pullPolicy: Never
  env:
    - name: OPERATOR_WEBHOOK_PORT
      value: "9090"
    - name: BACKEND_URL
      value: "http://backend:8081"
    - name: NATS_URL
      value: "nats://nats:4222"
    - name: OTEL_SDK_DISABLED
      value: "true"

reasoner:
  fullnameOverride: reasoner
  replicaCount: 1
  image:
    repository: runguard-reasoner
    tag: latest
    pullPolicy: Never
  env:
    - name: REASONER_PORT
      value: "8082"
    - name: OTEL_SDK_DISABLED
      value: "true"

worker:
  fullnameOverride: worker
  replicaCount: 1
  image:
    repository: runguard-worker
    tag: latest
    pullPolicy: Never
  env:
    - name: NATS_URL
      value: "nats://nats:4222"
    - name: BACKEND_URL
      value: "http://backend:8081"
    - name: OTEL_SDK_DISABLED
      value: "true"

web-ui:
  fullnameOverride: web-ui
  replicaCount: 1
  image:
    repository: runguard-web-ui
    tag: latest
    pullPolicy: Never
  volumes:
    - name: nginx-cache
      emptyDir: {}
    - name: nginx-run
      emptyDir: {}
  volumeMounts:
    - name: nginx-cache
      mountPath: /var/cache/nginx
    - name: nginx-run
      mountPath: /var/run
