global:
  imageRegistry: ""
  imageTag: ""
  namespace: "runguard"
  environment: "dev"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  automount: false
  annotations: {}
  name: ""

# Per-service overrides — these merge with each sub-chart's own values.yaml
api-gateway:
  enabled: true
  replicaCount: 1
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

backend:
  enabled: true
  replicaCount: 1

operator:
  enabled: true
  replicaCount: 1

worker:
  enabled: true
  replicaCount: 1

reasoner:
  enabled: true
  replicaCount: 1

web-ui:
  enabled: true
  replicaCount: 1
