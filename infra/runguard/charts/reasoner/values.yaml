replicaCount: 1

image:
  repository: ghcr.io/phuoctmse/runguard/reasoner
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8082

httpRoute:
  enabled: false

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

env:
  - name: REASONER_PORT
    value: "8082"
  - name: REASONER_NATS_URL
    value: "nats://nats:4222"
  - name: REASONER_LLM_MODEL
    value: "claude-sonnet-4-6"
  - name: REASONER_MAX_TOKENS
    value: "2048"

# REASONER_ANTHROPIC_API_KEY comes from runguard-secrets
envFrom:
  - secretRef:
      name: runguard-secrets
      optional: true

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
