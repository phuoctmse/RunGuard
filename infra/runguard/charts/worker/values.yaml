replicaCount: 1

image:
  repository: ghcr.io/phuoctmse/runguard/worker
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8083

httpRoute:
  enabled: false

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# worker has no HTTP server — uses exec probe
livenessProbe:
  exec:
    command: ["sh", "-c", "pgrep -x worker || exit 1"]
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  exec:
    command: ["sh", "-c", "pgrep -x worker || exit 1"]
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

env:
  - name: NATS_URL
    value: "nats://nats:4222"
  - name: BACKEND_URL
    value: "http://backend:8081"

envFrom:
  - secretRef:
      name: runguard-secrets
      optional: true

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
