replicaCount: 1

image:
  repository: ghcr.io/phuoctmse/runguard/api-gateway
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080

httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: runguard-gateway
      sectionName: https
  hostnames:
    - api.runguard.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  - name: API_GATEWAY_PORT
    value: "8080"
  - name: BACKEND_URL
    value: "http://backend:8081"

envFrom:
  - secretRef:
      name: runguard-secrets
      optional: true

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
