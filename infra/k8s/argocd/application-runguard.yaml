apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: runguard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/phuoctmse/runguard.git
    targetRevision: main
    path: infra/runguard
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: runguard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
