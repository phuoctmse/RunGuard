apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: runguard-gateway
  namespace: runguard
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
spec:
  gatewayClassName: runguard-gc
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: runguard-tls
      allowedRoutes:
        namespaces:
          from: Same
---
# Redirect all HTTP traffic to HTTPS
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: runguard
spec:
  parentRefs:
    - name: runguard-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
