apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: runguard-secrets
  namespace: runguard
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm-store
    kind: ClusterSecretStore
  target:
    name: runguard-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: /runguard/prod/anthropic-api-key

    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: /runguard/prod/postgres-password

    - secretKey: NATS_CREDENTIALS
      remoteRef:
        key: /runguard/prod/nats-credentials
