apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: runguard-tls
  namespace: runguard
spec:
  secretName: runguard-tls
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
  dnsNames:
    - runguard.local
    - api.runguard.local
