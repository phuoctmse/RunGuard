name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write   # required for Cosign OIDC keyless signing

env:
  GO_VERSION: "1.25.10"
  PYTHON_VERSION: "3.14"

jobs:
  go-build:
    name: Build Go Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, backend, operator]
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build ${{ matrix.service }} (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          cd services/${{ matrix.service }}
          go build -o ../../bin/${{ matrix.service }}-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/main.go

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/${{ matrix.service }}-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 30

  python-build:
    name: Build Python Package (reasoner)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/reasoner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: reasoner-dist
          path: services/reasoner/dist/
          retention-days: 30

  release:
    needs: [go-build, python-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets/

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          else
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changes }}

            ## Artifacts
            ### Go Services (cross-platform)
            - `api-gateway-{linux,darwin,windows}-{amd64,arm64}`
            - `backend-{linux,darwin,windows}-{amd64,arm64}`
            - `operator-{linux,darwin,windows}-{amd64,arm64}`

            ### Python
            - `reasoner` wheel and sdist
          files: release-assets/**/*
          generate_release_notes: true

  docker-build-push:
    name: Docker Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [go-build, python-build]
    strategy:
      matrix:
        service: [api-gateway, backend, operator, reasoner, worker, web-ui]
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/phuoctmse/runguard/${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/phuoctmse/runguard/${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-scan:
    name: Trivy Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, backend, operator, reasoner, worker, web-ui]
    steps:
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/phuoctmse/runguard/${{ matrix.service }}:${{ github.ref_name }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  sign:
    name: Cosign Sign (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [container-scan]
    strategy:
      matrix:
        service: [api-gateway, backend, operator, reasoner, worker, web-ui]
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign image (keyless OIDC)
        run: |
          cosign sign --yes \
            ghcr.io/phuoctmse/runguard/${{ matrix.service }}:${{ github.ref_name }}

      - name: Attach SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/phuoctmse/runguard/${{ matrix.service }}:${{ github.ref_name }}
          format: spdx-json
          upload-artifact: true
          artifact-name: sbom-${{ matrix.service }}.spdx.json

  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: [sign, release]
    environment: staging
    steps:
      - name: Install ArgoCD CLI
        run: |
          VERSION=$(curl -s https://api.github.com/repos/argoproj/argo-cd/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4)
          curl -fsSL "https://github.com/argoproj/argo-cd/releases/download/${VERSION}/argocd-linux-amd64" \
            -o /usr/local/bin/argocd
          chmod +x /usr/local/bin/argocd

      - name: Sync runguard-staging
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd app sync runguard-staging \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --timeout 300
          argocd app wait runguard-staging \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --health --sync --timeout 300

  # prod: manual approval gate via GitHub Environment protection rules
  deploy-prod:
    name: Deploy → prod (manual)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: prod       # GitHub Environment with required reviewers
    steps:
      - name: Install ArgoCD CLI
        run: |
          VERSION=$(curl -s https://api.github.com/repos/argoproj/argo-cd/releases/latest \
            | grep '"tag_name"' | cut -d'"' -f4)
          curl -fsSL "https://github.com/argoproj/argo-cd/releases/download/${VERSION}/argocd-linux-amd64" \
            -o /usr/local/bin/argocd
          chmod +x /usr/local/bin/argocd

      - name: Sync runguard-prod
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd app sync runguard-prod \
            --server "$ARGOCD_SERVER" \
            --auth-token "$ARGOCD_AUTH_TOKEN" \
            --grpc-web \
            --timeout 300

  notify-failure:
    needs: [go-build, python-build, docker-build-push, container-scan, sign, release, deploy-staging]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack on failure
        if: env.SLACK_WEBHOOK != ''
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Release failed on ${{ github.ref_name }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Release Failed* on `${{ github.repository }}`\nTag: `${{ github.ref_name }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
