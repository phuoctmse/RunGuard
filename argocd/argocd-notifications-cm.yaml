apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # Slack integration — token is injected from argocd-notifications-secret
  service.slack: |
    token: $slack-token

  # ── Templates ────────────────────────────────────────────────────────────────

  template.app-sync-succeeded: |
    slack:
      attachments: |
        [{
          "color": "#18be52",
          "title": "✅ {{.app.metadata.name}} synced",
          "text": "Environment: `{{.app.spec.destination.namespace}}`\nRevision: `{{.app.status.sync.revision}}`",
          "footer": "ArgoCD",
          "ts": "{{.app.status.operationState.finishedAt}}"
        }]

  template.app-sync-failed: |
    slack:
      attachments: |
        [{
          "color": "#E96D76",
          "title": "❌ {{.app.metadata.name}} sync failed",
          "text": "Environment: `{{.app.spec.destination.namespace}}`\nPhase: `{{.app.status.operationState.phase}}`\nMessage: {{.app.status.operationState.message}}",
          "footer": "ArgoCD"
        }]

  template.app-health-degraded: |
    slack:
      attachments: |
        [{
          "color": "#f4c030",
          "title": "⚠️ {{.app.metadata.name}} health degraded",
          "text": "Environment: `{{.app.spec.destination.namespace}}`\nHealth: `{{.app.status.health.status}}`\nMessage: {{.app.status.health.message}}",
          "footer": "ArgoCD"
        }]

  template.app-deployed: |
    slack:
      attachments: |
        [{
          "color": "#18be52",
          "title": "🚀 {{.app.metadata.name}} deployed",
          "text": "Environment: `{{.app.spec.destination.namespace}}`\nImage tag: `{{.app.status.summary.images}}`",
          "footer": "ArgoCD"
        }]

  # ── Triggers ─────────────────────────────────────────────────────────────────

  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      send: [app-sync-succeeded]

  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]

  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]

  trigger.on-deployed: |
    - when: app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
      send: [app-deployed]

  # ── Default subscriptions (applies to all apps in argocd namespace) ──────────
  defaultTriggers: |
    - on-sync-failed
    - on-health-degraded
